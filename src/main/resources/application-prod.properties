spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
platform.jwt-secret=${JWT_SECRET}
platform.cache.enabled=${CACHE_ENABLED:false}
logging.structured.format.console=${LOG_STRUCTURED_FORMAT:ecs}
product.image.mode=${PRODUCT_IMAGE_MODE:s3}
product.image.s3.bucket=${PRODUCT_IMAGE_S3_BUCKET}
product.image.s3.region=${PRODUCT_IMAGE_S3_REGION}
product.image.s3.media-origin=${PRODUCT_IMAGE_S3_MEDIA_ORIGIN:}
management.endpoint.health.show-details=${HEALTH_DETAILS:never}
