name: product

services:
  product:
    image: ${PRODUCT_IMAGE:-microsserv52-product:local}
    build:
      context: .
    ports:
      - "${PRODUCT_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/${PRODUCT_DB_NAME:-product}
      SPRING_DATASOURCE_USERNAME: ${PRODUCT_DB_USER:-product}
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD:-product}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
      CACHE_REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_DETAILS: ${HEALTH_DETAILS:-never}
      PRODUCT_IMAGE_MODE: ${PRODUCT_IMAGE_MODE:-mock}
      PRODUCT_IMAGE_STORAGE_URL: ${PRODUCT_IMAGE_STORAGE_URL:-http://image-storage:8090}
    depends_on:
      product-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      image-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  product-db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME:-product}
      POSTGRES_USER: ${PRODUCT_DB_USER:-product}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:-product}
    ports:
      - "${PRODUCT_DB_PORT:-5432}:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${PRODUCT_REDIS_PORT:-6379}:6379"
    volumes:
      - product-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  identity:
    build:
      context: ./mocks/identity
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development-use-a-long-random-secret}
    ports:
      - "${PRODUCT_IDENTITY_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  image-storage:
    build:
      context: ./mocks/image-storage
    hostname: image-storage
    environment:
      IMAGE_STORAGE_DATA_DIR: /data
    ports:
      - "${PRODUCT_IMAGE_STORAGE_PORT:-8090}:8090"
    volumes:
      - product-image-storage-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  product-db-data:
  product-redis-data:
  product-image-storage-data:
