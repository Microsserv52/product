spring.application.name=product
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.tomcat.connection-timeout=5s
server.max-http-request-header-size=16KB

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://product-db:5432/product}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:product}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:product}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

spring.data.redis.url=${CACHE_REDIS_URL:redis://redis:6379/0}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
spring.cache.type=none

platform.jwt-secret=${JWT_SECRET:change-me-in-development-use-a-long-random-secret}
platform.cache.enabled=${CACHE_ENABLED:false}
platform.cache.ttl-seconds=${CACHE_TTL_SECONDS:60}
platform.http.max-request-bytes=${MAX_REQUEST_BYTES:16384}

product.image.mode=${PRODUCT_IMAGE_MODE:mock}
product.image.storage-url=${PRODUCT_IMAGE_STORAGE_URL:http://image-storage:8090}
product.image.media-base-url=${PRODUCT_MEDIA_BASE_URL:/media}
product.image.upload-expiry=${PRODUCT_IMAGE_UPLOAD_EXPIRY:PT10M}
product.image.s3.bucket=${PRODUCT_IMAGE_S3_BUCKET:}
product.image.s3.region=${PRODUCT_IMAGE_S3_REGION:}
product.image.s3.media-origin=${PRODUCT_IMAGE_S3_MEDIA_ORIGIN:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_DETAILS:never}
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=${CACHE_ENABLED:false}
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=Product catalogue microservice

logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n
