spring.datasource.url=jdbc:h2:mem:product;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.data.redis.url=redis://127.0.0.1:6379/15
spring.cache.type=none
platform.jwt-secret=test-secret-with-at-least-32-characters-long
platform.cache.enabled=false
management.health.redis.enabled=false
logging.level.root=WARN
